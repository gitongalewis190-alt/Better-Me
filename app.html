<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Better Me">
  <title>Better Me</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="splash-1170x2532.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="splash-1284x2778.png" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="splash-1179x2556.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="splash-1290x2796.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="splash-750x1334.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top">
    <div class="brand"><strong>Better Me</strong><span>Daily SOPs <i id="sync" class="sync" data-s="saved"></i></span></div>
    <div class="actions">
      <button id="search" class="icon-btn" aria-label="Search and commands (Ctrl K)"></button>
      <button id="print" class="icon-btn" aria-label="Print or export"></button>
      <button id="settings" class="icon-btn" aria-label="Settings"></button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Main">
    <button data-tab="home"><i data-ic="home"></i><span>Home</span></button>
    <button data-tab="progress"><i data-ic="chart"></i><span>Progress</span></button>
    <button data-tab="new"><i data-ic="plus"></i><span>New</span></button>
    <button data-tab="history"><i data-ic="clock"></i><span>History</span></button>
    <button data-tab="profile" class="avatar-tab"><span id="avatar"></span><span>You</span></button>
  </nav>

  <div id="ptr" class="ptr" aria-hidden="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="sheet" class="sheet"></div>

  <script type="module" src="app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
