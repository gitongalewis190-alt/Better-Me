<!doctype html>
<html lang="en" data-theme="light" data-bg="aurora">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Better Me">
  <meta name="description" content="Plan your day, focus, build habits and review how you are really doing.">
  <title>Better Me</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Paint the saved theme before anything renders, so there is no flash.
    try { const m = localStorage.getItem('bm:mode'); const k = Object.keys(localStorage).find(x => x.startsWith('bettermeV1:') && !x.includes(':snap:') && (m === 'guest' ? x.endsWith(':guest') : !x.endsWith(':guest')));
      const st = k ? JSON.parse(localStorage.getItem(k)).settings || {} : {};
      const dark = st.theme === 'dark' || ((!st.theme || st.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'; if (st.bg) document.documentElement.dataset.bg = st.bg; } catch (e) {}
  </script>
  <script src="vendor/supabase.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="bg-fx" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
  <div id="defs"></div>

  <aside class="side" aria-label="Main navigation">
    <div class="side-brand"><img src="icon.svg" alt="" width="34" height="34"><div><b>Better Me</b><small>Daily SOPs</small></div></div>
    <button class="side-search" data-act="search"><i data-ic="search" data-s="16"></i><span>Search…</span><kbd>⌘K</kbd></button>
    <nav id="nav" class="side-nav"></nav>
    <div class="side-foot">
      <button class="side-btn" data-act="report" data-tip-r="Export PDF (E)"><i data-ic="download" data-s="18"></i><span>Export report</span></button>
      <button class="side-btn" data-act="settings" data-tip-r="Settings (,)"><i data-ic="gear" data-s="18"></i><span>Settings</span></button>
      <div id="userCard" class="user-card"></div>
    </div>
  </aside>

  <header class="top">
    <div class="top-brand"><img src="icon.svg" alt="" width="30" height="30"><b id="topTitle">Better Me</b><i class="sync" data-s="saved"></i></div>
    <div class="top-acts">
      <button class="ibtn" data-act="search" aria-label="Search and commands"><i data-ic="search"></i></button>
      <button class="ibtn" data-act="report" aria-label="Export PDF report"><i data-ic="download"></i></button>
      <button class="ibtn" data-act="settings" aria-label="Settings"><i data-ic="gear"></i></button>
    </div>
  </header>

  <div class="shell">
    <main id="view" tabindex="-1">
      <div id="boot" class="boot"><div class="skel w60"></div><div class="skel h120"></div><div class="skel"></div><div class="skel h200"></div></div>
    </main>
    <aside id="aside" class="aside" aria-label="Summary"></aside>
  </div>

  <nav class="tabs" aria-label="Main">
    <button data-act="go" data-v="today"><i data-ic="home" data-s="22"></i><span>Today</span></button>
    <button data-act="go" data-v="plan"><i data-ic="calendar" data-s="22"></i><span>Plan</span></button>
    <button class="fab" data-act="plan-sheet" aria-label="New task"><i data-ic="plus" data-s="26"></i></button>
    <button data-act="go" data-v="focus"><i data-ic="timer" data-s="22"></i><span>Focus</span></button>
    <button data-act="more"><i data-ic="menu" data-s="22"></i><span>More</span></button>
  </nav>

  <div id="ptr" class="ptr" aria-hidden="true"><i data-ic="repeat" data-s="18"></i></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="sheet" class="sheet"></div>
  <div id="lock" class="lock" hidden></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <canvas id="confetti" class="confetti" hidden></canvas>

  <script type="module" src="app.js"></script>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));</script>
</body>
</html>
