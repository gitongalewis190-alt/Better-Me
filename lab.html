<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <title>Lab · Better Me</title>
  <style>
    :root{--bg:#fbfaf7;--card:#ffffff;--ink:#1d1d1f;--mut:#8a8680;--ok:#c96442;--line:#e9e4da;color-scheme:light}
    @media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1d1c19;--ink:#f3efe8;--mut:#9a958c;--line:#2c2a25;color-scheme:dark}}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
    .card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .back{color:var(--mut);text-decoration:none;font-size:22px;line-height:1;padding:4px}
    h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
    .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:20px}
    .seg button{border:0;background:none;padding:9px;border-radius:10px;cursor:pointer;color:var(--mut);font:inherit;font-size:15px}
    .seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    form{display:grid;gap:12px}
    input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
    input:focus{outline:2px solid var(--ok);outline-offset:0;border-color:transparent}
    .primary{margin-top:6px;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:14px;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
    .primary:disabled{opacity:.5;cursor:default}
    #msg{min-height:1.5em;margin:4px 0 0;color:var(--mut);font-size:14px;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="top">
      <a class="back" href="index.html" aria-label="Back to home">‹</a>
      <h1>Lab</h1>
      <span style="width:22px"></span>
    </div>
    <div class="seg" role="tablist">
      <button id="m-in" class="on" type="button">Sign in</button>
      <button id="m-up" type="button">Create account</button>
    </div>
    <form id="f" novalidate>
      <input name="email" type="email" required placeholder="Email" autocomplete="email">
      <input name="password" type="password" required minlength="6" placeholder="Password" autocomplete="current-password">
      <button id="go" class="primary" type="submit">Sign in</button>
      <p id="msg" role="status"></p>
    </form>
  </main>

  <script type="module">
    import { currentUser, signIn, signUp } from './src/auth.js';

    if (await currentUser()) location.replace('app.html');

    const f = document.getElementById('f');
    const msg = document.getElementById('msg');
    const go = document.getElementById('go');
    let mode = 'in';

    function setMode(m) {
      mode = m;
      document.getElementById('m-in').classList.toggle('on', m === 'in');
      document.getElementById('m-up').classList.toggle('on', m === 'up');
      go.textContent = m === 'in' ? 'Sign in' : 'Create account';
      f.password.autocomplete = m === 'in' ? 'current-password' : 'new-password';
      msg.textContent = '';
    }

    document.getElementById('m-in').onclick = () => setMode('in');
    document.getElementById('m-up').onclick = () => setMode('up');

    f.onsubmit = async e => {
      e.preventDefault();
      if (!f.reportValidity()) return;
      const email = f.email.value.trim();
      const password = f.password.value;
      go.disabled = true;
      msg.textContent = '';
      try {
        if (mode === 'in') {
          await signIn(email, password);
          location.replace('app.html');
        } else {
          const { session } = await signUp(email, password);
          if (session) location.replace('app.html');
          else msg.textContent = 'Check your email to confirm, then sign in.';
        }
      } catch (err) {
        msg.textContent = err.message || 'Something went wrong. Try again.';
      } finally {
        go.disabled = false;
      }
    };
  </script>
</body>
</html>
