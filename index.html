<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <title>Better Me</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{--bg:#fbfaf7;--ink:#1d1d1f;--mut:#8a8680;--ok:#c96442;--line:#e9e4da;color-scheme:light}
    @media (prefers-color-scheme:dark){:root{--bg:#141412;--ink:#f3efe8;--mut:#9a958c;--line:#2c2a25;color-scheme:dark}}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100vh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 32px) 24px calc(env(safe-area-inset-bottom) + 32px)}
    .wrap{display:grid;justify-items:center;gap:40px;text-align:center}
    .mark{display:grid;grid-template-columns:repeat(7,16px);gap:12px}
    .mark i{width:16px;height:16px;border-radius:50%;background:var(--line)}
    .mark i.a{background:color-mix(in srgb,var(--ok) 35%,transparent)}
    .mark i.b{background:color-mix(in srgb,var(--ok) 70%,transparent)}
    .mark i.c{background:var(--ok)}
    h1{margin:0;font-size:clamp(40px,8vw,56px);font-weight:600;letter-spacing:-.03em;line-height:1.05}
    .cta{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:999px;padding:14px 32px;font-weight:600;font-size:16px}
    .cta:focus-visible{outline:2px solid var(--ok);outline-offset:4px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark" aria-hidden="true">
      <i></i><i class="a"></i><i class="c"></i><i class="a"></i><i></i><i class="b"></i><i class="c"></i>
      <i class="b"></i><i></i><i class="c"></i><i class="c"></i><i class="b"></i><i class="a"></i><i></i>
      <i class="c"></i><i class="b"></i><i class="a"></i><i class="c"></i><i></i><i class="a"></i><i class="b"></i>
      <i></i><i class="a"></i><i class="c"></i><i class="b"></i><i class="c"></i><i></i><i class="a"></i>
    </div>
    <h1>Better Me</h1>
    <a class="cta" href="lab.html">Enter the lab</a>
  </main>
</body>
</html>
