<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ef">
  <title>Better Me</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="splash-1170x2532.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="splash-1284x2778.png" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="splash-1179x2556.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="splash-1290x2796.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="splash-750x1334.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)">
  <style>
    :root{--bg:#f4f3ef;--card:#fff;--ink:#14141a;--mut:#5c5c66;--acc:#ff5a36;--ok:#1fc57a;--amb:#ffb020;--line:#e7e6ec;--shadow:0 30px 60px -20px rgba(20,20,30,.25);color-scheme:light}
    @media (prefers-color-scheme:dark){:root{--bg:#0c0c10;--card:#17171e;--ink:#f6f6fa;--mut:#aeaebc;--line:#272730;--shadow:0 30px 60px -20px rgba(0,0,0,.7);color-scheme:dark}}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100vh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 28px)}
    .wrap{display:grid;justify-items:center;gap:28px;text-align:center;width:100%;max-width:420px}
    .brand{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
    h1{margin:0;font-size:clamp(40px,9vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1}
    .phone{width:280px;height:520px;border-radius:44px;background:var(--card);box-shadow:var(--shadow);padding:18px;border:1px solid var(--line);display:grid;gap:12px;align-content:start;text-align:left;transform:rotate(-2deg);animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-6px)}}
    .notch{width:90px;height:24px;border-radius:14px;background:var(--ink);justify-self:center;margin-bottom:4px}
    .m-h{font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
    .m-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
    .m-ring{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:18px;padding:12px}
    .m-ring i{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--ok) 0 72%,var(--line) 72% 100%);position:relative;flex:none}
    .m-ring i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
    .m-task{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;padding:10px 0;border-top:1px solid var(--line)}
    .m-task b{width:20px;height:20px;border-radius:7px;border:2.5px solid var(--line);flex:none}
    .m-task.done b{background:var(--ok);border-color:var(--ok)}
    .m-task.done span{text-decoration:line-through;color:var(--mut)}
    .m-tag{margin-left:auto;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;color:#fff}
    .m-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
    .m-cal i{aspect-ratio:1;border-radius:9px;background:var(--bg)}
    .m-cal i.a{background:color-mix(in srgb,var(--acc) 35%,var(--card))}
    .m-cal i.b{background:color-mix(in srgb,var(--acc) 70%,var(--card))}
    .m-cal i.c{background:var(--ok)}
    .cta{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:999px;padding:16px 34px;font-weight:800;font-size:16px;box-shadow:0 14px 30px -12px rgba(20,20,30,.5);transition:transform .2s}
    .cta:active{transform:scale(.97)}
    .cta:focus-visible{outline:3px solid var(--acc);outline-offset:4px}
    @media (prefers-reduced-motion:reduce){.phone{animation:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="brand">Better Me</p>
    <div class="phone" aria-hidden="true">
      <div class="notch"></div>
      <p class="m-h">Thursday</p>
      <p class="m-title">Today</p>
      <div class="m-ring"><i></i><div><div style="font-weight:800">3 of 4 done</div><div style="font-size:12px;color:var(--mut)">Keep the streak</div></div></div>
      <div class="m-task done"><b></b><span>Read two chapters</span><em class="m-tag" style="background:#ff5a36;font-style:normal">Academic</em></div>
      <div class="m-task done"><b></b><span>Sketch the logo</span><em class="m-tag" style="background:#7c5cff;font-style:normal">Personal</em></div>
      <div class="m-task done"><b></b><span>Send two invoices</span><em class="m-tag" style="background:#1fc57a;font-style:normal">Monetization</em></div>
      <div class="m-task"><b></b><span>Revise lecture notes</span><em class="m-tag" style="background:#ff5a36;font-style:normal">Academic</em></div>
      <p class="m-h" style="margin-top:6px">This month</p>
      <div class="m-cal">
        <i class="c"></i><i class="b"></i><i class="c"></i><i class="a"></i><i class="c"></i><i class="b"></i><i></i>
        <i class="c"></i><i class="c"></i><i class="b"></i><i class="c"></i><i class="a"></i><i></i><i></i>
        <i class="b"></i><i class="c"></i><i class="c"></i><i class="c"></i><i class="b"></i><i class="a"></i><i></i>
      </div>
    </div>
    <a class="cta" href="lab.html">Enter the lab</a>
  </main>
</body>
</html>
